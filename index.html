<!DOCTYPE html>
<html lang="ku" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">مراسمی خەتمی قورئانی پیرۆز</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18191a);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            text-align: center;
            overflow-x: hidden;
        }

        /* دکمه تغییر زبان */
        .lang-bar {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 8px;
        }
        .lang-btn {
            background: var(--tg-theme-secondary-bg-color, #242526);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lang-btn:active {
            background: #3390ec;
        }

        /* سرپەڕی کۆڕ و کات */
        .header-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            width: 100%;
            max-width: 360px;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            margin-bottom: 12px;
        }
        .event-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .event-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
        }
        .event-date, .event-time {
            font-size: 12px;
            opacity: 0.95;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin: 0 auto;
        }

        /* دیاریکردنی جۆزی ئەم هەفتەیە */
        .juz-badge {
            background: linear-gradient(135deg, #134e4a 0%, #065f46 100%);
            border: 1px solid #34d399;
            color: #ecfdf5;
            width: 100%;
            max-width: 360px;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(6, 95, 70, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* شوێن و مزگەوتی میوانداری ئەم هەفتەیە */
        .location-box {
            display: flex;
            align-items: center;
            background: var(--tg-theme-secondary-bg-color, #242526);
            border: 1px solid rgba(212, 175, 55, 0.3);
            width: 100%;
            max-width: 360px;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 18px;
            text-align: right;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }
        .location-icon {
            font-size: 22px;
            margin-left: 12px;
            flex-shrink: 0;
        }
        .location-info {
            display: flex;
            flex-direction: column;
        }
        .location-title {
            font-size: 11px;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .location-name {
            font-size: 13px;
            font-weight: bold;
        }

        /* تایمر */
        .timer-title {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #b0b3b8);
            margin-bottom: 8px;
            font-weight: bold;
        }
        .timer-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 360px;
            margin-bottom: 20px;
            direction: ltr;
        }
        .time-box {
            background: var(--tg-theme-secondary-bg-color, #242526);
            padding: 10px 6px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            flex: 1;
            min-width: 0;
            border-bottom: 3px solid #3390ec;
        }
        .time-number {
            font-size: 20px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #3390ec);
        }
        .time-label {
            font-size: 10px;
            margin-top: 4px;
            color: var(--tg-theme-hint-color, #8a8d91);
        }

        /* تب‌های دورها */
        .rounds-tabs {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: var(--tg-theme-secondary-bg-color, #242526);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #3390ec;
            color: #ffffff;
            border-color: #3390ec;
            box-shadow: 0 3px 8px rgba(51, 144, 236, 0.4);
        }

        /* لیستی قورئانخوێنەکان */
        .reciters-section {
            width: 100%;
            max-width: 360px;
            margin-bottom: 20px;
        }
        .reciter-card {
            display: flex;
            align-items: center;
            background: var(--tg-theme-secondary-bg-color, #242526);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 9px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            text-align: right;
            border-right: 4px solid #3390ec;
        }
        .reciter-number {
            font-size: 12px;
            font-weight: bold;
            background: rgba(51, 144, 236, 0.15);
            color: #3390ec;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 12px;
            flex-shrink: 0;
        }
        .reciter-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            margin-left: 12px;
            border: 2px solid #3390ec;
            flex-shrink: 0;
        }
        .reciter-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .reciter-name {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reciter-desc {
            font-size: 11px;
            color: var(--tg-theme-hint-color, #a0a3a7);
            margin-top: 2px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- دکمه تغییر زبان -->
    <div class="lang-bar">
        <button class="lang-btn" id="lang-toggle-btn" onclick="toggleLanguage()">🌐 کوردی</button>
    </div>

    <!-- سەرپەڕی کۆڕ و کات -->
    <div class="header-card">
        <div class="event-title" id="t-event-title"></div>
        <div class="event-meta">
            <span class="event-date" id="t-event-date"></span>
            <span class="event-time" id="t-event-time"></span>
        </div>
    </div>

    <!-- دیاریکردنی جوزئی ئەم هەفتەیە -->
    <div class="juz-badge" id="t-juz-badge"></div>

    <!-- شوێن و مزگەوتی میوانداری ئەم هەفتەیە -->
    <div class="location-box">
        <div class="location-icon">🕌</div>
        <div class="location-info">
            <span class="location-title" id="t-loc-title"></span>
            <span class="location-name" id="t-loc-name"></span>
        </div>
    </div>

    <div class="timer-title" id="t-timer-title"></div>
    
    <!-- تایمر -->
    <div class="timer-container">
        <div class="time-box">
            <div id="days" class="time-number">00</div>
            <div class="time-label" id="t-days"></div>
        </div>
        <div class="time-box">
            <div id="hours" class="time-number">00</div>
            <div class="time-label" id="t-hours"></div>
        </div>
        <div class="time-box">
            <div id="minutes" class="time-number">00</div>
            <div class="time-label" id="t-mins"></div>
        </div>
        <div class="time-box">
            <div id="seconds" class="time-number">00</div>
            <div class="time-label" id="t-secs"></div>
        </div>
    </div>

    <!-- تب‌های دورها -->
    <div class="rounds-tabs">
        <button class="tab-btn active" id="t-round1-btn" onclick="switchRound(1)"></button>
        <button class="tab-btn" id="t-round2-btn" onclick="switchRound(2)"></button>
    </div>

    <!-- لیستی قورئانخوێنانی خولی یەکەم (توسط جاوااسکریپت پر می‌شود) -->
    <div id="round1-list" class="reciters-section"></div>

    <!-- لیستی قورئانخوێنانی خولی دووەم (توسط جاوااسکریپت پر می‌شود) -->
    <div id="round2-list" class="reciters-section hidden"></div>

    <script>

        // =========================================================================
        const weeklyConfig = {

            countdownDate: "2026-10-07T19:30:00",

            // ۲. اطلاعات متنی به زبان کوردی
            ku: {
                date: "📅 چوارشەممە ١٥ی ڕەزبەر ۱۴۰۵",
                time: "⏰ کات: دوای نوێژی عیشا",

            round1Reciters: [

                { num: "۲", name: "یحیی خیاطیان",          pages: "لاپەڕەی ٤ و ٥",     img: "yahya.jpg" },
                { num: "۳", name: "مهدی سعیدی",            pages: "لاپەڕەی ٦ و ٧",     img: "mehdi.jpg" },
                { num: "۴", name: "سیدکامران حسینی",       pages: "لاپەڕەی ٨ و ٩",     img: "kamran.jpg" },

            round2Reciters: [

                { num: "۹",  name: "محمد حسین زاده",   pages: "لاپەڕەی ۱٨ و ١٩", img: "mohammadh.jpg" },

        // =========================================================================
        // پایان بخش تنظیمات هفتگی (به کدهای پایین نیازی نیست دست بزنید)

        const staticTexts = {
            ku: {
                langBtn: "🌐 کوردی",
                eventTitle: "✨ خەتمی هەفتانەی قورئانی پیرۆز ✨",
                juzPrefix: "📖 تیلاوەتی ئەم هەفتەیە: ",
                locTitle: "مزگەوتی میوانداری ئەم هەفتەیە:",

                days: "ڕۆژ",
                hours: "کاتژمێر",
                mins: "خولەک",
                secs: "چرکە",
                round1Btn: "خولی یەکەم",

                timerTitle: "⏳ زمان باقی‌مانده تا شروع مراسم",
                days: "روز",

                timerEnded: "🎉 مراسم آغاز شد!"
            }
        };

        let currentLang = 'ku';

        // ساخت خودکار کارت‌های قاریان
        function renderReciters() {
            const r1Container = document.getElementById('round1-list');
            const r2Container = document.getElementById('round2-list');

            r1Container.innerHTML = weeklyConfig.round1Reciters.map(r => `
                <div class="reciter-card">
                    <div class="reciter-number">${r.num}</div>
                    <img src="${r.img}" class="reciter-img" alt="قاری">
                    <div class="reciter-info">
                        <span class="reciter-name">${r.name}</span>
                        <span class="reciter-desc">${r.pages}</span>
                    </div>
                </div>
            `).join('');

            r2Container.innerHTML = weeklyConfig.round2Reciters.map(r => `
                <div class="reciter-card">
                    <div class="reciter-number">${r.num}</div>
                    <img src="${r.img}" class="reciter-img" alt="قاری">
                    <div class="reciter-info">
                        <span class="reciter-name">${r.name}</span>
                        <span class="reciter-desc">${r.pages}</span>
                    </div>
                </div>
            `).join('');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ku' ? 'fa' : 'ku';
            updatePageLanguage();
        }

        function updatePageLanguage() {
            const st = staticTexts[currentLang];
            const wc = weeklyConfig[currentLang];

            document.getElementById('html-root').setAttribute('lang', currentLang);
            document.getElementById('lang-toggle-btn').innerText = st.langBtn;
            document.getElementById('t-event-title').innerText = st.eventTitle;
            document.getElementById('t-event-date').innerText = wc.date;
            document.getElementById('t-event-time').innerText = wc.time;
